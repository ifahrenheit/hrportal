{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <div class="mb-3"><i class="bi bi-calendar2-check" style="font-size:3rem;color:#1e3a5f;"></i></div>
      <h4 class="fw-bold mb-1">Leave Portal</h4>
      <p class="text-muted mb-4 small">4-Day Work Week Leave Management</p>
      <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login with SSO
      </a>
      <p class="text-muted mt-3 small">Uses your existing company account</p>
    </div>
  </div>
</div>
{% endblock %}
